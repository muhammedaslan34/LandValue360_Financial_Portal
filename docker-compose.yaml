services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lv360_portal}
      POSTGRES_USER: ${POSTGRES_USER:-lv360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      APP_DB_USER: ${APP_DB_USER:-lv360_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LV360_PORTAL_ENV: production
      LV360_PORTAL_SECRET_KEY: ${LV360_PORTAL_SECRET_KEY:?Set LV360_PORTAL_SECRET_KEY}
      LV360_PORTAL_BASE_URL: ${LV360_PORTAL_BASE_URL:-https://${DOMAIN}}
      POSTGRES_DB: ${POSTGRES_DB:-lv360_portal}
      POSTGRES_USER: ${POSTGRES_USER:-lv360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-lv360_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      LV360_PORTAL_STORAGE_BACKEND: s3
      LV360_PORTAL_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL}
      LV360_PORTAL_S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL}}
      LV360_PORTAL_S3_REGION: ${S3_REGION:-eu-central-2}
      LV360_PORTAL_S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      LV360_PORTAL_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      LV360_PORTAL_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      LV360_PORTAL_EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      LV360_PORTAL_SMTP_HOST: ${SMTP_HOST:-}
      LV360_PORTAL_SMTP_PORT: ${SMTP_PORT:-587}
      LV360_PORTAL_SMTP_USERNAME: ${SMTP_USERNAME:-}
      LV360_PORTAL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LV360_PORTAL_SMTP_FROM: ${SMTP_FROM:-notifications@${DOMAIN}}
      LV360_PORTAL_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      LV360_PORTAL_AUTO_VERIFY_EMAIL: ${AUTO_VERIFY_EMAIL:-false}
      LV360_PORTAL_COOKIE_SECURE: "true"
      LV360_PORTAL_TRUSTED_HOSTS: ${LV360_PORTAL_TRUSTED_HOSTS:-${DOMAIN},127.0.0.1,localhost}
      LV360_PORTAL_HEALTH_HOST: ${LV360_PORTAL_HEALTH_HOST:-127.0.0.1}
      LV360_PORTAL_SLA_HOURS: ${SLA_HOURS:-24}
    expose:
      - "8090"
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.lv360-gzip.compress=true
      - traefik.http.middlewares.lv360-redirect.redirectscheme.scheme=https
      - traefik.http.routers.lv360-http.entrypoints=http
      - traefik.http.routers.lv360-http.middlewares=lv360-redirect
      - traefik.http.routers.lv360-http.rule=Host(`sia-ai.net`)
      - traefik.http.routers.lv360-http.service=lv360-app
      - traefik.http.routers.lv360-https.entrypoints=https
      - traefik.http.routers.lv360-https.middlewares=lv360-gzip
      - traefik.http.routers.lv360-https.rule=Host(`sia-ai.net`)
      - traefik.http.routers.lv360-https.service=lv360-app
      - traefik.http.routers.lv360-https.tls=true
      - traefik.http.routers.lv360-https.tls.certresolver=letsencrypt
      - traefik.http.services.lv360-app.loadbalancer.server.port=8090
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  notification-worker:
    build: .
    restart: unless-stopped
    entrypoint: ["/app/scripts/worker_entrypoint.sh"]
    depends_on:
      app:
        condition: service_started
    environment:
      LV360_PORTAL_ENV: production
      LV360_PORTAL_SECRET_KEY: ${LV360_PORTAL_SECRET_KEY}
      LV360_PORTAL_BASE_URL: ${LV360_PORTAL_BASE_URL:-https://${DOMAIN}}
      POSTGRES_DB: ${POSTGRES_DB:-lv360_portal}
      APP_DB_USER: ${APP_DB_USER:-lv360_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      LV360_PORTAL_STORAGE_BACKEND: s3
      LV360_PORTAL_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL}
      LV360_PORTAL_S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL}}
      LV360_PORTAL_S3_REGION: ${S3_REGION:-eu-central-2}
      LV360_PORTAL_S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      LV360_PORTAL_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      LV360_PORTAL_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      LV360_PORTAL_EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      LV360_PORTAL_SMTP_HOST: ${SMTP_HOST:-}
      LV360_PORTAL_SMTP_PORT: ${SMTP_PORT:-587}
      LV360_PORTAL_SMTP_USERNAME: ${SMTP_USERNAME:-}
      LV360_PORTAL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LV360_PORTAL_SMTP_FROM: ${SMTP_FROM:-notifications@${DOMAIN}}
      LV360_PORTAL_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      LV360_PORTAL_AUTO_VERIFY_EMAIL: ${AUTO_VERIFY_EMAIL:-false}
      LV360_PORTAL_COOKIE_SECURE: "true"
      LV360_PORTAL_TRUSTED_HOSTS: ${LV360_PORTAL_TRUSTED_HOSTS:-${DOMAIN}}

volumes:
  postgres_data:

networks:
  default:
  coolify:
    external: true
