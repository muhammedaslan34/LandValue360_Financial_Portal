{% extends "base.html" %}
{% block content %}
<section class="auth-card panel password-change-card">
  <p class="eyebrow" data-ar="أمان الحساب" data-en="Account Security">أمان الحساب</p>
  <h1 data-ar="تغيير كلمة المرور" data-en="Change Password">تغيير كلمة المرور</h1>
  <p data-ar="تم تعيين كلمة مرور مؤقتة لهذا الحساب. اختر كلمة مرور شخصية جديدة قبل متابعة استخدام المنصة." data-en="A temporary password was assigned to this account. Choose a new private password before continuing.">تم تعيين كلمة مرور مؤقتة لهذا الحساب. اختر كلمة مرور شخصية جديدة قبل متابعة استخدام المنصة.</p>
  <form id="changePasswordForm" class="form-grid single-column">
    <label data-ar="كلمة المرور الحالية" data-en="Current Password"><span class="i18n-label">كلمة المرور الحالية</span><input type="password" name="current_password" minlength="10" autocomplete="current-password" required></label>
    <label data-ar="كلمة المرور الجديدة" data-en="New Password"><span class="i18n-label">كلمة المرور الجديدة</span><input type="password" name="new_password" minlength="10" autocomplete="new-password" required></label>
    <label data-ar="تأكيد كلمة المرور الجديدة" data-en="Confirm New Password"><span class="i18n-label">تأكيد كلمة المرور الجديدة</span><input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label>
    <button class="button full" type="submit" data-ar="حفظ كلمة المرور والمتابعة" data-en="Save Password and Continue">حفظ كلمة المرور والمتابعة</button>
  </form>
  <p class="form-message" id="formMessage"></p>
</section>
{% endblock %}
{% block scripts %}<script src="/static/auth.js" defer></script>{% endblock %}
