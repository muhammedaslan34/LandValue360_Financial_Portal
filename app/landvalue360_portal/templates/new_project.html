{% extends "base.html" %}{% block content %}<section class="panel"><h1>إنشاء مشروع</h1><form id="newProjectForm" class="form-grid"><label>المؤسسة<select name="organization_id" required>{% for org in organizations %}<option value="{{ org.id }}">{{ org.name }}</option>{% endfor %}</select></label><label>اسم المشروع<input name="name" required></label><label>العملة<select name="currency"><option>USD</option><option>SYP</option><option>EUR</option><option>SAR</option><option>AED</option><option>TRY</option></select></label><label class="full">الوصف<textarea name="description"></textarea></label><button class="button full">إنشاء ومتابعة الإدخال</button><p class="form-message full" id="formMessage"></p></form></section>{% endblock %}{% block scripts %}<script src="/static/project.js" defer></script>{% endblock %}
