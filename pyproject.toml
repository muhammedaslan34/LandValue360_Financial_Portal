[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landvalue360-financial-portal"
version = "2.5.0"
description = "LandValue360 standalone monthly financial and land negotiation portal"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "sqlalchemy==2.0.50",
  "alembic==1.18.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.13.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.22",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "openpyxl==3.1.5",
  "Pillow==12.2.0",
  "defusedxml==0.7.1",
  "boto3==1.43.18",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0"]
postgres = ["psycopg[binary]==3.3.3"]

[project.scripts]
lv360-portal = "landvalue360_portal.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
landvalue360_portal = ["templates/*.html", "static/*"]
