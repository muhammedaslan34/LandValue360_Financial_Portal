name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lv360_test
          POSTGRES_USER: lv360
          POSTGRES_PASSWORD: lv360-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lv360 -d lv360_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r requirements-runtime-lock.txt -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: PYTHONPATH=app pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: LV360_RUN_BROWSER_E2E=1 PYTHONPATH=app pytest -q tests/browser
      - run: for f in app/landvalue360_portal/static/*.js; do node --check "$f"; done
      - name: Release gate - foundation
        run: PYTHONPATH=app python scripts/release_gate.py --phase foundation
      - name: Release gate - artifacts
        run: PYTHONPATH=app python scripts/release_gate.py --phase artifacts
      - name: Release gate - collate
        run: PYTHONPATH=app python scripts/release_gate.py --collate
      - name: Live HTTP smoke
        run: PYTHONPATH=app python scripts/live_http_smoke.py
      - name: PostgreSQL migration smoke
        env:
          LV360_PORTAL_DATABASE_URL: postgresql+psycopg://lv360:lv360-test-password@127.0.0.1:5432/lv360_test
          LV360_PORTAL_MIGRATION_DATABASE_URL: postgresql+psycopg://lv360:lv360-test-password@127.0.0.1:5432/lv360_test
        run: PYTHONPATH=app alembic upgrade head
